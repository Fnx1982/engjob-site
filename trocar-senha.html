<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="login.css" />
    <script src="auth-worker.js"></script>
    <script src="auth-guard.js"></script>
    <title>Trocar senha — Eng Job</title>
</head>
<body>
    <main class="container">
        <form onsubmit="event.preventDefault(); trocarSenha();">
            <h1>Nova senha</h1>
            <p style="text-align:center; font-size:13px; color:#666; margin-bottom:18px;">
                Você entrou com uma senha temporária. Escolha uma senha nova pra continuar.
            </p>
            <div class="input-box">
                <input id="novaSenha" placeholder="Nova senha (mín. 8 caracteres)" type="password" required minlength="8" />
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="input-box">
                <input id="confirmarSenha" placeholder="Confirme a nova senha" type="password" required minlength="8" />
                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="login">Salvar e continuar</button>
            <p id="mensagemErroTroca" style="color: crimson; text-align: center; margin-top: 10px; font-size: 13px; display: none;"></p>
        </form>
    </main>

    <script src="trocar-senha.js"></script>
</body>
</html>
