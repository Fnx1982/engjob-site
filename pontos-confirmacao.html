<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bater Ponto</title>
  <link rel="stylesheet" href="pontos.css" />
  <script src="confirm-modal.js?v=2"></script>
  <script src="validacao.js?v=2"></script>
  <script src="permissoes-setor.js?v=2"></script>
  <script src="pontos-core.js?v=2"></script>
</head>
<body>
  <main class="container">
    <div class="topo-pagina">
      <div>
        <h1>Bater Ponto</h1>
        <p id="nomeUsuarioLogado">Carregando...</p>
      </div>
      <a href="home.html" class="btn-voltar">Voltar</a>
    </div>

    <div class="card-relogio">
      <div class="relogio-display" id="relogioDisplay">00:00:00</div>
      <div class="data-display" id="dataDisplay">--/--/----</div>
      <button class="btn-bater-ponto" id="btnBaterPonto">Registrar Ponto</button>
      <p id="proximaBatidaTexto" style="margin-top:14px;color:#888;font-size:13px;"></p>
    </div>

    <div class="cards-banco" id="cardsBanco">
      <div class="card-banco">
        <div class="rotulo">Jornada Diária</div>
        <div class="valor neutro" id="cardJornada">8h00m</div>
      </div>
      <div class="card-banco">
        <div class="rotulo">Horas Trabalhadas</div>
        <div class="valor neutro" id="cardTrabalhadas">0h00m</div>
      </div>
      <div class="card-banco">
        <div class="rotulo">Banco de Horas</div>
        <div class="valor" id="cardSaldo">0h00m</div>
      </div>
      <div class="card-banco">
        <div class="rotulo">Dias Trabalhados</div>
        <div class="valor neutro" id="cardDias">0</div>
      </div>
    </div>

    <div class="secao-titulo">Batidas de Hoje</div>
    <div class="lista-batidas" id="listaBatidasHoje">
      <p style="color:#999;font-size:13px;">Nenhuma batida registrada hoje.</p>
    </div>

    <div class="secao-titulo" style="margin-top:24px;">Histórico do Mês</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <div class="select-simples" style="min-width:160px;">
        <label for="filtroMesPonto">Mês</label>
        <select id="filtroMesPonto"></select>
      </div>
      <div class="select-simples" style="min-width:120px;">
        <label for="filtroAnoPonto">Ano</label>
        <select id="filtroAnoPonto"></select>
      </div>
    </div>
    <div id="historicoMes"></div>

    <div class="secao-titulo" style="margin-top:24px;">Lançamentos Especiais</div>
    <div class="lista-lancamentos" id="listaLancamentos">
      <p style="color:#999;font-size:13px;">Nenhum lançamento registrado.</p>
    </div>
  </main>

  <script src="pontos-confirmacao.js?v=2"></script>
</body>
</html>
